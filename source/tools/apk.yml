# The APK on the download page, built and signed by GitHub after a release that did not have the
# signing key at hand (release.py in a fresh Claude or Codex session). The key lives in the repository
# secrets OMA_KEYSTORE (the .jks file, base64) and OMA_KEYSTORE_PASSWORD. A release that built the APK
# itself (with the key on the computer) already carries it: then this does nothing.
# Copied to .github/workflows/apk.yml by release.py.
name: APK
on:
  push:
    branches: [main]
    paths: ['source/android/AndroidManifest.xml']     # the version changes with every release
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Is the APK on the download page this version already?
        id: need
        run: |
          bash source/tools/android_sdk.sh
          want=$(grep -o 'android:versionCode="[0-9]*"' source/android/AndroidManifest.xml | grep -o '[0-9]*')
          have=$($HOME/sdk/android/build-tools/35.0.0/aapt2 dump badging OmasMahjong.apk 2>/dev/null | grep -o "versionCode='[0-9]*'" | grep -o '[0-9]*' || true)
          echo "download page: ${have:-none}, release: $want"
          if [ "$have" = "$want" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Signing key from the repository secrets
        if: steps.need.outputs.skip != '1'
        env:
          KS: ${{ secrets.OMA_KEYSTORE }}
          PW: ${{ secrets.OMA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::The repository secrets OMA_KEYSTORE and OMA_KEYSTORE_PASSWORD are missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p source/android/keystore
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > source/android/keystore/oma-mahjong.jks
          printf '%s' "$PW" | tr -d '\r\n' > source/android/keystore/password.txt
      - name: Build and sign (checks it is the same key as always)
        if: steps.need.outputs.skip != '1'
        run: bash source/android/build.sh
      - name: Put it on the download page
        if: steps.need.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf source/android/keystore
          cp source/android/build/OmasMahjong.apk OmasMahjong.apk
          v=$(grep -o 'android:versionName="[^"]*"' source/android/AndroidManifest.xml | cut -d'"' -f2)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OmasMahjong.apk
          git commit -q -m "APK $v (signed on GitHub)"
          ok=0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && { ok=1; break; }
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::could not push the APK"; exit 1; }
          # (a push by this workflow may not start the Pages build by itself)
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
