<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranglijst — ontwerpkeuzes</title><style>
@font-face{font-family:Nunito;src:url('../../www/fonts/nunito-latin-800-normal.woff2');font-weight:800}@font-face{font-family:Nunito;src:url('../../www/fonts/nunito-latin-900-normal.woff2');font-weight:900}*{box-sizing:border-box}body{margin:0;background:#f8f2df;color:#443720;font:800 16px Nunito, sans-serif}button{font:inherit;border:0;color:inherit}main{max-width:480px;margin:auto;min-height:100dvh;padding:24px 20px 16px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}header button{width:42px;height:42px;border-radius:14px;background:#fff9e8;font-size:25px;box-shadow:0 3px #e8dfc6}h1{font-size:29px;margin:0;letter-spacing:-.6px}header .profile{font-size:24px;background:#fff9e8;border-radius:50%;width:42px;height:42px;display:grid;place-items:center}.eyebrow{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:#8d7a50}h2{font-size:26px;margin:5px 0 6px;line-height:1.1}.muted{color:#8a7c61;font-size:14px}.tabs{display:flex;background:#e9e1cb;padding:5px;border-radius:16px;gap:4px;margin:22px 0 14px}.tabs button{flex:1;background:transparent;border-radius:12px;padding:11px 0;font-size:15px;color:#887a5e}.tabs button.on{background:#fffdf4;color:#3f5137;box-shadow:0 2px 5px #4f402014}.until{display:flex;justify-content:space-between;margin:0 2px 17px;font-size:13px;color:#8a7c61}.rows{display:grid;gap:10px}.row{display:flex;align-items:center;gap:11px;background:#fffdf6;border:1px solid #e8e0cd;border-radius:18px;padding:13px 12px;min-height:78px}.rank{font-size:15px;color:#a19271;width:20px;text-align:center}.av{width:43px;height:43px;border-radius:15px;background:#f1ebda;display:grid;place-items:center;font-size:26px;flex:none;position:relative}.dot{position:absolute;width:9px;height:9px;background:#53a75d;border:2px solid #fffdf6;border-radius:50%;right:-2px;bottom:1px}.name{flex:1;min-width:0;font-size:16px;line-height:1.15}.name small{display:block;font-size:12px;color:#958265;margin-top:5px}.score{text-align:right;font-size:18px;line-height:1.15;font-weight:900}.score small{font-size:11px;display:block;font-weight:800;color:#a09170;margin-top:4px}.heart{width:30px;background:#fff0df;height:30px;border-radius:50%;font-size:17px;margin-left:3px;flex:none}.row.me{background:#fff0b8;border:2px solid #dba33b;padding:12px 11px}.you{font-size:11px;border-radius:5px;padding:2px 4px;background:#ead18a;color:#655023;margin-left:3px}.footer{text-align:center;font-size:12px;color:#9d9074;margin:22px 0 0}.intro{margin-bottom:0}.intro .muted{margin-top:8px}body.a{background:radial-gradient(circle at 100% 0,#ffe4a0,transparent 48%),#f6f1df}.a .board{background:#e9e2ce;padding:9px;border-radius:24px}.a .rows{gap:6px}.a .row{border:0;box-shadow:0 2px 0 #d8cfb7}.a .row.me{box-shadow:0 0 0 2px #ddab39 inset}.a .rank{font-size:21px;width:25px}.a .row .name{font-size:15px}.a .heart{margin-left:0}.a .av{width:37px;height:40px;font-size:24px}.a .score{font-size:17px}.a .row{gap:8px;padding:11px 9px;min-height:73px}
body.b{background:#154d40;color:#fff8df}.b main{background:radial-gradient(circle at 50% 25%,#2a7058,transparent 45%)}.b header button,.b header .profile{background:#276452;box-shadow:none;color:#fff8df}.b .eyebrow{color:#cddac8;text-align:center}.b h2{text-align:center;font-size:29px;margin-top:7px}.b .tabs{background:#0b382e;margin-top:20px}.b .tabs button{color:#adccbb}.b .tabs button.on{background:#fff3ce;color:#3f5137}.podium{display:flex;align-items:flex-end;justify-content:center;gap:9px;margin:23px 0 22px}.podium .place{background:#276553;text-align:center;border:1px solid #4a826c;border-radius:22px 22px 12px 12px;padding:17px 5px 13px;width:30%;position:relative}.podium .first{padding-top:26px;background:#fff0b2;color:#4b4124;min-height:196px}.podium .second{min-height:168px}.podium .third{min-height:148px}.podium .crown{position:absolute;top:-27px;left:0;right:0;font-size:35px}.podium .av{margin:0 auto 10px;border-radius:50%;width:48px;height:48px;background:#ffffff22}.podium b{display:block;font-size:14px;line-height:1.1}.podium strong{display:block;margin-top:8px;font-size:19px}.podium small{display:block;font-size:11px;opacity:.65;margin-top:3px}.podium .num{font-size:12px;opacity:.6;margin-bottom:8px}.b .row{background:#23604e;border-color:#437c65;color:#fff8df;min-height:75px}.b .name small,.b .score small,.b .rank{color:#b2cdb8}.b .row.me{background:#fff3ce;color:#4b4124;border-color:#ffd473}.b .row.me small{color:#887145}.b .av{background:#ffffff20}.b .row.me .av{background:#e9dab0}.b .heart{background:#32725c}.b .score{font-size:17px}.b .until{color:#b3c9b8;margin-bottom:14px}.b .footer{color:#a0bfad}.b .personal{display:flex;justify-content:space-between;padding:13px 3px 0;font-size:13px;color:#d0dfcc}.b .personal b{color:#ffe093}.b .name{font-size:15px}
body.c{background:#eff5f1;color:#28463b}.c main{background:radial-gradient(ellipse at top left,#dcece3,transparent 65%)}.c header button,.c header .profile{background:#fff;box-shadow:0 2px 0 #d4e3da}.c .eyebrow{color:#6d9580}.c .summary{background:#214f3e;color:#fff;border-radius:24px;padding:20px;display:flex;justify-content:space-between;align-items:center;margin:20px 0 16px}.c .summary small{display:block;color:#afc6b7;font-size:12px;margin-top:5px}.c .summary strong{font-size:32px;letter-spacing:-1px}.c .summary .position{text-align:right;font-size:19px}.c .tabs{background:#dfeae2;margin:18px 0 13px}.c .until{color:#77917e}.c .rows{gap:0;background:#fff;border-radius:22px;overflow:hidden;border:1px solid #dbe7df}.c .row{background:none;border:0;border-radius:0;border-bottom:1px solid #e8efea;padding:15px 13px;min-height:95px;gap:10px}.c .row:last-child{border:0}.c .row.me{background:#e5f1e6;padding:15px 13px}.c .rank{color:#729581;font-size:15px;width:16px}.c .av{width:39px;height:39px;background:#f1f6f1;font-size:24px}.c .name{font-size:15px}.c .name small{font-size:11px;color:#7e9a88}.c .score{font-size:16px;color:#2c5943}.c .heart{background:#f2f5ec}.c .you{background:#c9dfca;color:#416545}.bar{height:5px;border-radius:9px;background:#e9f0e9;margin-top:9px;overflow:hidden}.bar i{height:100%;display:block;background:#8cb699;border-radius:9px}.c .row.me .bar i{background:#396e4d}.c .footer{color:#829b89;margin-top:16px}
</style><body><main id="content"></main><script>
const variant=new URLSearchParams(location.search).get('v')||'a';document.body.className=variant;
const people=[{n:'Dennis',av:'😊',p:18450,l:211,online:true},{n:'Gerda',av:'🌷',p:15280,l:178},{n:'PUK',av:'🐈',p:12860,l:104,online:true},{n:'Oma',av:'👵',p:10540,l:126,me:true},{n:'Mrs. Doubtfire',av:'🦋',p:8320,l:187}];
const num=n=>n.toLocaleString('nl-NL');
const avatar=p=>`<span class="av">${p.av}${p.online?'<i class="dot"></i>':''}</span>`;
function row(p,i){return `<div class="row ${p.me?'me':''}"><span class="rank">${variant==='a'?['🥇','🥈','🥉'][i]||i+1:i+1}</span>${avatar(p)}<div class="name">${p.n}${p.me?'<span class="you">jij</span>':''}<small>${variant==='c'?(i===0?'Hoogste weekscore':num(people[0].p-p.p)+' punten tot #1'):'Level '+p.l+(p.online?' · online':'')}</small>${variant==='c'?`<div class="bar"><i style="width:${p.p/people[0].p*100}%"></i></div>`:''}</div><div class="score">${num(p.p)}${variant!=='c'?'<small>punten</small>':''}</div>${p.me?'':'<button class="heart">💛</button>'}</div>`}
const header='<header><button>‹</button><h1>Ranglijst</h1><div class="profile">👵</div></header>';
const tabs='<nav class="tabs"><button class="on">Deze week</button><button>All-time</button></nav>';
const until='<div class="until"><span>Maandag begint een nieuwe week</span><span>nog 4 dagen</span></div>';
let html=header;
if(variant==='a'){html+='<div class="intro"><div class="eyebrow">Samen puzzelen</div><h2>De familie aan zet</h2><div class="muted">Jij staat op plek 4 van 5</div></div>'+tabs+until+'<div class="board"><div class="rows">'+people.map(row).join('')+'</div></div>';}
if(variant==='b'){html+='<div class="eyebrow">Onze weekstrijd</div><h2>Wie pakt de kroon?</h2>'+tabs+'<div class="podium">'+[1,0,2].map(i=>{const p=people[i];return `<div class="place ${['first','second','third'][i]}">${i===0?'<span class="crown">👑</span>':''}<div class="num">#${i+1}</div>${avatar(p)}<b>${p.n}</b><strong>${num(p.p)}</strong><small>punten</small></div>`}).join('')+'</div>'+until+'<div class="rows">'+people.slice(3).map((p,i)=>row(p,i+3)).join('')+'</div><div class="personal"><span>Volgende plek: PUK</span><b>Nog 2.321 punten</b></div>';}
if(variant==='c'){html+='<div class="eyebrow">Elke puzzel telt</div><h2>Jouw week in punten</h2><div class="summary"><div><strong>10.540</strong><small>Jouw punten deze week</small></div><div class="position">#4 <span style="opacity:.5">/ 5</span><small>Nog 2.321 tot #3</small></div></div>'+tabs+until+'<div class="rows">'+people.map(row).join('')+'</div>';}
html+='<p class="footer">Voorbeeldstand · 💛 stuur een hartje</p>';document.getElementById('content').innerHTML=html;
</script></body></html>
