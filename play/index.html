<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b4d3c">
<title>Oma's Mahjong</title>
<link rel="stylesheet" href="style.css?v=0.6">
<script>
  // if anything fails to load, say so instead of showing a dead screen
  window.addEventListener('error', function (e) {
    var d = document.getElementById('loadErr');
    if (!d) { d = document.createElement('div'); d.id = 'loadErr'; d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:999;background:#fff3c4;color:#3b2a14;border-radius:14px;padding:12px 14px;font:700 16px sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.35)'; (document.body || document.documentElement).appendChild(d); }
    d.textContent = 'Er ging iets mis bij het laden. Herlaad de pagina (vernieuwen). [' + (e.message || 'bestand') + ']';
  }, true);
</script>
</head>
<body>
<div id="bg"></div>
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="home-top">
      <div class="chip big-chip" id="homeStars">⭐ 0</div>
      <button class="icon-btn" id="btnSettings" aria-label="Instellingen">⚙️</button>
    </div>
    <div class="logo">
      <div class="logo-tiles">
        <div class="lt t1"></div><div class="lt t2"></div><div class="lt t3"></div>
      </div>
      <h1>Oma's Mahjong</h1>
      <p class="greet" id="greet">Goedemorgen!</p>
    </div>
    <div class="home-buttons">
      <button class="big-btn play" id="btnPlay">
        <span class="bb-icon">▶</span>
        <span class="bb-text"><b>Spelen</b><small id="playLabel">Level 1</small></span>
      </button>
      <button class="big-btn daily" id="btnDaily">
        <span class="bb-icon">📅</span>
        <span class="bb-text"><b>Dagpuzzel</b><small id="dailyLabel">Puzzel van vandaag</small></span>
        <span class="streak" id="streakBadge">🔥 0</span>
      </button>
      <div class="row2">
        <button class="mid-btn" id="btnLevels"><span>🗺️</span>Levels</button>
        <button class="mid-btn" id="btnThemes"><span>🎨</span>Thema's</button>
        <button class="mid-btn" id="btnTrophies"><span>🏅</span>Prijzen<i class="mid-badge" id="trophyCount">0</i></button>
      </div>
    </div>
    <div class="goal" id="nextUnlock"></div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btnHome" aria-label="Menu">🏠</button>
      <div class="title-wrap">
        <div id="gameTitle">Level 1</div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
      <div class="chip score" id="score">0</div>
      <button class="icon-btn" id="btnRestart" aria-label="Level opnieuw beginnen">↻</button>
    </div>
    <div class="traybar">
      <div id="tray"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
    </div>
    <div id="boardWrap"><div id="board"></div></div>
    <div class="toolbar">
      <button class="tool" id="btnHint"><span>💡</span>Hint<i class="badge">1</i></button>
      <button class="tool" id="btnShuffle"><span>🔀</span>Schudden<i class="badge">1</i></button>
    </div>
    <div id="praise"></div>
    <div id="comboTag"></div>
  </section>

  <!-- LEVELS -->
  <section id="levels" class="screen">
    <div class="header"><button class="icon-btn back">←</button><h2>Levels</h2><div class="chip" id="lvStars">⭐ 0</div></div>
    <div class="scroll"><div class="level-grid" id="levelGrid"></div></div>
  </section>

  <!-- DAILY -->
  <section id="daily" class="screen">
    <div class="header"><button class="icon-btn back">←</button><h2>Dagpuzzel</h2><div class="chip" id="dStreak">🔥 0</div></div>
    <div class="scroll">
      <div class="card streak-card">
        <div class="flame">🔥</div>
        <div><b id="streakText">0 dagen op rij</b><small id="bestText">Record: 0 dagen</small></div>
      </div>
      <div class="card cal">
        <div class="cal-head">
          <button class="icon-btn small" id="calPrev">‹</button>
          <b id="calTitle">oktober 2026</b>
          <button class="icon-btn small" id="calNext">›</button>
        </div>
        <div class="cal-days"><span>ma</span><span>di</span><span>wo</span><span>do</span><span>vr</span><span>za</span><span>zo</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-count" id="calCount"></div>
      </div>
      <button class="big-btn play" id="btnPlayDaily"><span class="bb-icon">▶</span><span class="bb-text"><b>Speel</b><small id="dailyDateLabel">vandaag</small></span></button>
    </div>
  </section>

  <!-- THEMES -->
  <section id="trophies" class="screen">
    <div class="header"><button class="icon-btn back">←</button><h2>Prijzenkast</h2><div class="chip" id="trCount">🏅 0</div></div>
    <div class="scroll"><div class="trophy-grid" id="trophyGrid"></div></div>
  </section>

  <section id="themes" class="screen">
    <div class="header"><button class="icon-btn back">←</button><h2>Thema's</h2><div class="chip" id="thStars">⭐ 0</div></div>
    <div class="scroll">
      <div id="sunCard"></div>
      <h3 class="sec">Stenen</h3>
      <div class="theme-list" id="tileThemes"></div>
      <h3 class="sec">Achtergrond</h3>
      <div class="bg-list" id="bgThemes"></div>
    </div>
  </section>
</div>

<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="modal" class="hidden"><div class="modal-box" id="modalBox"></div></div>

<script src="tiles.js?v=0.6"></script>
<script src="audio.js?v=0.6"></script>
<script src="layouts.js?v=0.6"></script>
<script src="game.js?v=0.6"></script>
</body>
</html>
